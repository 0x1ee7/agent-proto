[package]
name = "a2a-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
a2a-core = { version = "0.1.0", path = "../a2a-core" }
a2a-security = { version = "0.1.0", path = "../a2a-security" }
a2a-types = { version = "0.1.0", path = "../a2a-types" }
bus-api = { version = "0.1.0", path = "../bus-api" }
bytes = "1.12.1"
pbjson-types = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
bus-mem = { path = "../bus-mem" }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
