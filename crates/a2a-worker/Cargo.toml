[package]
name = "a2a-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testkit = []

[dependencies]
a2a-audit = { version = "0.1.0", path = "../a2a-audit" }
a2a-workspace = { version = "0.1.0", path = "../a2a-workspace" }
a2a-core = { version = "0.1.0", path = "../a2a-core" }
a2a-types = { version = "0.1.0", path = "../a2a-types" }
a2a-security = { version = "0.1.0", path = "../a2a-security" }
bus-api = { version = "0.1.0", path = "../bus-api" }
a2a-client = { version = "0.1.0", path = "../a2a-client" }
a2a-mcp = { version = "0.1.0", path = "../a2a-mcp", default-features = false, features = ["runtime"] }
bytes = "1.12.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
pbjson-types = "0.9.0"
thiserror = "2.0.21"
base64 = "0.22.1"
getrandom = "0.4.3"
sha2 = "0.11.0"

[dev-dependencies]
bus-mem = { path = "../bus-mem" }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
