[package]
name = "bus-nats"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
a2a-types = { version = "0.1.0", path = "../a2a-types" }
async-nats = "0.50.0"
bus-api = { version = "0.1.0", path = "../bus-api" }
bytes = "1.12.1"
futures-util = "0.3.31"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "fs", "io-util", "net"] }

[dev-dependencies]
a2a-conformance = { version = "0.1.0", path = "../a2a-conformance" }
nkeys = "0.4.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util", "process"] }
