[package]
name = "a2a-security"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
a2a-types = { version = "0.1.0", path = "../a2a-types" }
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
getrandom = "0.4.3"
pbjson-types = "0.9.0"
prost = "0.14.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["parsing", "formatting"] }
toml = "1.1.8"
