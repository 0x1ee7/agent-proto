[package]
name = "a2a-audit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
a2a-types = { version = "0.1.0", path = "../a2a-types" }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
pbjson-types = "0.9.0"
prost = "0.14.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v7", "fast-rng"] }

[dev-dependencies]
tempfile = "3.27.0"
